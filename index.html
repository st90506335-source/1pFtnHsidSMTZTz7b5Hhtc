<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>娛樂雜貨鋪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky slim header + one content column (max 1180px); phones get a bottom tab bar. Clean, low-noise, every item carries its source. */
:root{
  --bg:#F4F5F2; --surface:#FCFCFA; --surface-2:#ECEEE9; --line:#D9DCD4;
  --ink:#161B22; --muted:#545B63;
  --accent:#C2410C; --on-accent:#FFFFFF; --accent-soft:#FBE6DC; --accent-ink:#9A3412;
  --promo:#1D4ED8; --promo-soft:#E2E9FF;
  --ok:#166534; --ok-soft:#DCF3E3; --danger:#B91C1C; --danger-soft:#FDE4E4;
  --hero-a:#1F2933; --hero-b:#3B2A22; --on-hero:#F4F5F2; --on-hero-muted:#C9CDD2;
  --shadow:0 1px 2px rgba(22,27,34,.05),0 6px 20px rgba(22,27,34,.06);
  --sans:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --latin:'Space Grotesk','Noto Sans TC',system-ui,sans-serif;
  --r:14px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151A; --surface:#1A1F26; --surface-2:#232932; --line:#313843;
  --ink:#ECEEF0; --muted:#A6AEB8;
  --accent:#FF8A5C; --on-accent:#14171C; --accent-soft:#3A2419; --accent-ink:#FFB08F;
  --promo:#9DB4FF; --promo-soft:#1F2846;
  --ok:#7EDB9E; --ok-soft:#173222; --danger:#FF9A9A; --danger-soft:#3A1C1C;
  --hero-a:#0D1014; --hero-b:#2A1C16; --on-hero:#ECEEF0; --on-hero-muted:#B4BAC2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151A; --surface:#1A1F26; --surface-2:#232932; --line:#313843;
  --ink:#ECEEF0; --muted:#A6AEB8;
  --accent:#FF8A5C; --on-accent:#14171C; --accent-soft:#3A2419; --accent-ink:#FFB08F;
  --promo:#9DB4FF; --promo-soft:#1F2846;
  --ok:#7EDB9E; --ok-soft:#173222; --danger:#FF9A9A; --danger-soft:#3A1C1C;
  --hero-a:#0D1014; --hero-b:#2A1C16; --on-hero:#ECEEF0; --on-hero-muted:#B4BAC2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;flex:none}
.ic.on path{fill:currentColor}
.num{font-family:var(--latin);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Notice + header */
.notice{background:var(--surface-2);color:var(--muted);font-size:13px}
.notice .wrap{padding-block:6px;display:flex;gap:8px;align-items:center;justify-content:center;text-align:center}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;font-size:19px;letter-spacing:.04em;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:9px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;background:var(--ink)}
.logo-mark i{border-radius:3px;background:var(--accent)}
.logo-mark i:nth-child(2){background:#F2C14E}.logo-mark i:nth-child(3){background:#7FB3A6}.logo-mark i:nth-child(4){background:var(--bg)}
nav.main{display:flex;gap:2px}
nav.main a{text-decoration:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:15px;white-space:nowrap}
nav.main a:hover{color:var(--ink);background:var(--surface-2)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--surface-2);font-weight:700}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mini-search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:0 6px 0 14px;height:40px;width:240px}
.mini-search input{border:0;background:transparent;outline:none;width:100%;min-width:0;font-size:14px}
.mini-search button{border:0;background:transparent;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted)}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--ink);text-decoration:none}
.icon-btn:hover{background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:14px}

/* Buttons, chips, badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.6;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge.type{background:var(--surface-2);color:var(--ink)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.promo{background:var(--promo-soft);color:var(--promo)}
.badge.warn{background:var(--accent-soft);color:var(--accent-ink)}
.src{font-size:13px;color:var(--muted)}

/* Sections */
main{padding-bottom:64px}
.view{padding-top:28px}
.page-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-h h1{font-size:30px;font-weight:900}
.page-h p{color:var(--muted)}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:700}
.sec-h a{font-size:14px;color:var(--accent-ink);font-weight:700;text-decoration:none;padding:10px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}

/* Hero */
.hero{margin-top:20px;border-radius:20px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--on-hero);padding:40px 32px}
.hero h1{font-size:clamp(28px,4.4vw,44px);font-weight:900;letter-spacing:.01em}
.hero p.sub{margin-top:10px;color:var(--on-hero-muted);font-size:17px}
.sform{margin-top:24px;max-width:760px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.1);margin-bottom:10px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:inherit;cursor:pointer;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.panel .seg,.view .seg.plain{background:var(--surface-2)}
.sbox{display:flex;gap:8px;background:var(--surface);border-radius:14px;padding:6px;border:1px solid var(--line)}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:0 12px;font-size:16px;color:var(--ink)}
.hero .hint{margin-top:12px;font-size:13px;color:var(--on-hero-muted)}

/* Category tiles */
.tile{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;min-height:132px;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile .ti{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:6px;color:#161B22}
.tile b{font-size:17px}
.tile span{font-size:14px;color:var(--muted)}

/* List rows */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);min-height:68px}
.item:first-child{border-top:0}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta span{font-size:13px;color:var(--muted)}
.item .meta > span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.active{background:var(--surface-2)}
.rank{width:28px;text-align:center;font-family:var(--latin);font-weight:700;font-size:20px;color:var(--muted);flex:none}
.cover{width:48px;height:48px;border-radius:10px;flex:none;display:grid;place-items:center;color:#161B22}
.play-sm{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.play-sm:hover{border-color:var(--accent);color:var(--accent-ink)}
.fav{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:12px;color:var(--muted);flex:none}
.fav:hover{background:var(--surface-2)}
.fav[aria-pressed="true"]{color:var(--accent)}
.c1{background:#F4A27F}.c2{background:#F2C14E}.c3{background:#7FB3A6}.c4{background:#B9B3E6}.c5{background:#E8B4C8}.c6{background:#A9CBE8}

/* Music */
.music-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.video{aspect-ratio:16/9;max-width:100%;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--on-hero);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.video small{color:var(--on-hero-muted);font-size:13px}
.big-play{width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.big-play .ic{width:30px;height:30px}
.pbar-wrap{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}
.now{padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.now h2{font-size:20px}
.now p{color:var(--muted);font-size:14px}
.lyr{padding:18px;display:flex;flex-direction:column;gap:4px}
.lyr button{all:unset;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:18px;color:var(--muted);transition:color .2s,background .2s}
.lyr button:hover{background:var(--surface-2)}
.lyr button:focus-visible{outline:3px solid var(--accent)}
.lyr button.cur{color:var(--ink);font-weight:700;background:var(--accent-soft)}
.rights{padding:12px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}

/* Podcast */
.pod-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.show{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;min-height:68px}
.show:first-child{border-top:0}
.show[aria-pressed="true"]{background:var(--surface-2)}
.show:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.ep-head{padding:20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ep-head h2{font-size:22px}
.ep-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.find{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line)}
.find input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.seg-row{display:flex;gap:14px;padding:14px 20px;border-top:1px solid var(--line);align-items:flex-start}
.seg-row:first-child{border-top:0}
.seg-row.cur{background:var(--accent-soft)}
.ts{flex:none;min-width:72px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--latin);font-weight:700;font-size:14px;color:var(--accent-ink)}
.seg-row b{display:block;font-size:15px}
.seg-row p{font-size:14px;color:var(--muted);margin-top:2px}
mark{background:var(--accent-soft);color:var(--ink);padding:0 2px;border-radius:3px}
.seg-row.cur mark{background:var(--surface)}

/* News */
.news-card{display:flex;flex-direction:column;gap:10px;padding:20px}
.news-card h3{font-size:18px;font-weight:700}
.ai-sum{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:15px}
.news-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.news-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}

/* Explore */
.ask{display:flex;gap:8px;padding:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ask input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:0 12px;font-size:16px;color:var(--ink)}
.answer{margin-top:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.claim{display:flex;gap:12px;align-items:flex-start}
.claim .badge{margin-top:3px;min-width:68px;justify-content:center}
.claim p{flex:1;min-width:0}
.claim sup{font-family:var(--latin);font-weight:700;color:var(--accent-ink);margin-left:2px}
.srcs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.srcc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.srcc:hover{border-color:var(--accent)}
.srcc:focus-visible{outline:3px solid var(--accent)}
.srcc b{font-size:14px}
.skel{height:14px;border-radius:7px;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* Charts */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;min-height:46px;padding:0 16px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.chart-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.metric{font-family:var(--latin);font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.trend-up{color:var(--ok);font-weight:700}
.promo-box{padding:18px;display:flex;flex-direction:column;gap:10px;border-color:var(--promo)}
.weights{padding:18px;display:flex;flex-direction:column;gap:10px}
.w-row{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.w-row .track{height:8px}
.w-row .track i{transition:none}

/* Account */
.auth-card{max-width:460px;margin:0 auto;padding:28px;display:flex;flex-direction:column;gap:12px}
.prov{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;width:100%}
.prov:hover{background:var(--surface-2)}
.prov[disabled]{cursor:not-allowed;color:var(--muted);border-style:dashed}
.prov .pl{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--latin);font-size:13px;font-weight:700;color:#fff}
.acct{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.idrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--danger-soft);color:var(--ink);margin-top:10px}

/* Form */
.form{padding:24px;display:grid;gap:16px;max-width:720px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field small{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
.field textarea{min-height:130px;resize:vertical}
.field.err input,.field.err textarea,.field.err select{border-color:var(--danger)}
.err-msg{color:var(--danger);font-size:13px;font-weight:700}
.row2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.success{padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:720px}

/* Footer */
footer{border-top:1px solid var(--line);margin-top:24px;color:var(--muted);font-size:14px}
footer .wrap{padding-block:28px;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:4px 18px}
footer a,footer button.link{color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;padding:10px 0;font-size:14px}
footer a:hover,footer button.link:hover{color:var(--ink)}

/* Toast + cookie + tabbar */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-size:14px}
.toast a,.toast button{color:var(--bg);font-weight:700;background:none;border:0;cursor:pointer;text-decoration:underline;padding:6px;white-space:nowrap}
.cookie{position:fixed;left:0;right:0;bottom:0;z-index:35;padding-bottom:env(safe-area-inset-bottom,0px)}

function goto(arr){
  const [v,id,seg]=arr;
  if(v==='music'){selectSong(id,false)}
  if(v==='podcast'){const e=epById(id);if(e){S.show=e.show.id;S.ep=id;S.pt=seg!=null&&SEGS[id]?SEGS[id][seg].s:0;S.findQ=''}}
  if(v==='news'&&id){S.newsCat='全部';S.newsFocus=id}
  if(location.hash==='#'+v) render(); else location.hash=v;
}
function addHistory(label){if(!S.user)return;S.history=[{label,at:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})},...S.history.filter(h=>h.label!==label)].slice(0,20);save()}

      <button class="prov" data-login="Apple"><span class="pl" style="background:#1F1F1F"></span>使用 Apple 繼續</button>
      <button class="prov" data-login="Facebook"><span class="pl" style="background:#1877F2">f</span>使用 Facebook 繼續</button>
      <button class="prov" disabled aria-describedby="ig-note"><span class="pl" style="background:#9AA0A6">IG</span>Instagram（評估中）</button>
      <p class="src" id="ig-note">Instagram 登入仍在確認可行性，暫不提供。登入為模擬，不會連到任何第三方服務。</p>
      <p class="src">第三方登入只用來驗證身分；之後可以把其他登入方式綁定到同一個帳號。</p>
    </div>`;
  const favItems=[...S.favs].map(id=>{const s=SONGS.find(x=>x.id===id);if(s)return {t:s.title,sub:'歌曲 · '+s.artist,go:['music',id]};const e=epById(id);if(e)return {t:e.title,sub:'Podcast · '+e.show.name,go:['podcast',id]};const n=NEWS.find(x=>x.id===id);if(n)return {t:n.title,sub:'新聞 · '+n.src,go:['news',id]};}).filter(Boolean);
  const ids=['Google','Apple','Facebook'];
  return `<div class="page-h"><div><h1>我的帳號</h1><p>收藏、紀錄與偏好都只屬於你，公開排行榜只使用彙總資料。</p></div></div>
  <div class="acct">
    <div class="panel" style="padding:20px">
      <div style="display:flex;gap:12px;align-items:center"><span class="avatar" style="width:48px;height:48px;font-size:18px">雜</span><div><b>示意會員</b><p class="src">會員編號 <span class="num">U-000128</span></p></div></div>
      <h3 style="font-size:15px;margin-top:20px">登入方式</h3>
      ${ids.map(p=>`<div class="idrow"><span>${p}</span>${S.user.ids.includes(p)?`<span class="badge ok">${ic('check')}已綁定</span>`:`<button class="btn sm" data-link="${p}">綁定</button>`}</div>`).join('')}
      <h3 style="font-size:15px;margin-top:20px">偏好設定</h3>
      <label class="toggle"><span>顯示同步歌詞</span><input type="checkbox" id="pref-lyrics" ${S.prefs.lyrics?'checked':''}></label>
      <label class="toggle"><span>依收聽紀錄個人化推薦</span><input type="checkbox" id="pref-personal" ${S.prefs.personal?'checked':''}></label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:20px">
        <button class="btn" data-export>匯出我的資料</button>
        <button class="btn ghost" data-logout>登出</button>
        <button class="btn danger" data-del>刪除帳號</button>
        ${S.confirmDel?`<div class="confirm" role="alert"><b>確定要刪除帳號？</b><span class="src" style="color:var(--ink)">收藏、紀錄與偏好會一併刪除，無法復原。</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm danger" data-delyes>確定刪除</button><button class="btn sm" data-delno>取消</button></div></div>`:''}
      </div>
    </div>
    <div class="grid">
      <div><div class="sec-h"><h2>我的收藏</h2><span class="src num">${favItems.length} 項</span></div>
        <div class="panel list">${favItems.length?favItems.map(f=>`<div class="item"><div class="meta"><b>${esc(f.t)}</b><span>${esc(f.sub)}</span></div><button class="btn sm" data-go='${JSON.stringify(f.go)}'>開啟</button></div>`).join('')
        :`<div class="empty"><b>還沒有收藏</b><span>在歌曲、單集或新聞旁按愛心，就會出現在這裡。</span><a class="btn sm" href="#music">去逛逛音樂</a></div>`}</div></div>
      <div><div class="sec-h"><h2>最近播放</h2>${S.history.length?`<button class="btn sm ghost" data-clearhist>清除紀錄</button>`:''}</div>
        <div class="panel list">${S.history.length?S.history.map(h=>`<div class="item"><div class="meta"><b>${esc(h.label)}</b><span>今天 <span class="num">${h.at}</span></span></div></div>`).join('')
        :`<div class="empty"><b>沒有播放紀錄</b><span>登入後播放的歌曲與單集會記錄在這裡。</span></div>`}</div></div>
    </div>
  </div>`;
};

V.contact=()=>{
  if(S.sent) return `<div class="page-h"><div><h1>合作與意見回饋</h1></div></div>
    <div class="panel success" role="status"><span class="badge ok">${ic('check')}已送出</span><h2 style="font-size:22px">謝謝你，我們收到了</h2>
    <p>案件編號 <b class="num">${S.sent}</b>。負責人會在 3 個工作天內以 Email 回覆，處理進度也會寄到你的信箱。</p>
    <button class="btn" data-newform>再填一份</button></div>`;
  return `<div class="page-h"><div><h1>合作與意見回饋</h1><p>合作提案、內容授權、功能建議或問題回報，都從這裡送出。</p></div></div>
  <form class="panel form" id="cform" novalidate>
    <div class="field"><label for="f-cat">類別</label><select id="f-cat"><option value="">請選擇</option><option>合作提案</option><option>內容授權</option><option>功能建議</option><option>問題回報</option></select></div>
    <div class="row2">
      <div class="field"><label for="f-name">聯絡人</label><input id="f-name" autocomplete="name"></div>
      <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" autocomplete="email" inputmode="email"></div>
    </div>
    <div class="field"><label for="f-org">公司或單位<span class="src">（選填）</span></label><input id="f-org" autocomplete="organization"></div>
    <div class="field"><label for="f-msg">內容</label><textarea id="f-msg" placeholder="請描述你的提案或遇到的問題；問題回報請附上發生的頁面。"></textarea></div>
    <div class="field"><label for="f-file">附件<span class="src">（選填）</span></label><input id="f-file" type="file" accept=".pdf,.png,.jpg,.jpeg"><small>PDF、PNG、JPG，單檔 10MB 以內；附件會先經過安全掃描。</small></div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="f-send">送出</button><span class="src">原型不會真的寄出資料。</span></div>
  </form>`;
};

/* ---------- Render + router ---------- */
const VIEWS=Object.keys(V);
let current='home';
function render(){
  $('#v-'+current).innerHTML=V[current]();
  const a=$('#acct-btn');
  a.innerHTML=S.user?'<span class="avatar">雜</span>':'登入';
  a.className=S.user?'icon-btn':'btn sm';
  a.setAttribute('aria-label',S.user?'我的帳號':'登入');
}
function route(){
  let v=location.hash.slice(1); if(!VIEWS.includes(v)) v='home';
  const changed=v!==current; current=v;
  VIEWS.forEach(n=>$('#v-'+n).hidden=n!==v);
  $$('[data-nav]').forEach(a=>a.dataset.nav===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  render();
  if(changed||S.newsFocus) window.scrollTo(0,0);
  if(v==='news'&&S.newsFocus){const el=$('#news-'+S.newsFocus);if(el)el.scrollIntoView({block:'center'});}
}
addEventListener('hashchange',()=>{if(location.hash!=='#news')S.newsFocus=null;route()});

/* ---------- Players ---------- */
let mt,pt;
function selectSong(id,play){
  S.song=id;S.t=0;clearInterval(mt);S.playing=false;
  if(play){togglePlay(true)}
}
function togglePlay(force){
  S.playing=force===true?true:!S.playing; clearInterval(mt);
  if(S.playing){
    if(S.pplaying){S.pplaying=false;clearInterval(pt)}
    const s=SONGS.find(x=>x.id===S.song);addHistory(s.title+'｜'+s.artist);
    mt=setInterval(()=>{S.t=(S.t+1)%32;updMusic()},1000);
  }
  if(current==='music') render();
}
function updMusic(){
  if(current!=='music')return;
  const tEl=$('#ptime');if(!tEl)return;
  tEl.textContent=fmt(S.t);$('#pbar').style.width=(S.t/32*100)+'%';
  $$('#lyr button').forEach(b=>b.classList.toggle('cur',S.t>=+b.dataset.s&&S.t<+b.dataset.e));
}
function togglePod(){
  S.pplaying=!S.pplaying;clearInterval(pt);
  if(S.pplaying){
    if(S.playing){S.playing=false;clearInterval(mt)}
    const e=epById(S.ep);addHistory(e.show.name+' EP'+e.no);
    pt=setInterval(()=>{S.pt=Math.min(S.pt+1,epById(S.ep).dur);if(current==='podcast'){const el=$('#pt');if(el)el.textContent=fmt(S.pt);const segs=SEGS[S.ep];if(segs&&segs.some(sg=>sg.s===S.pt))render()}},1000);
  }
  render();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  const d=t.dataset;
  if(d.mode){S.mode=d.mode;const f=t.closest('[data-sform]');const inp=f&&f.querySelector('input');if(inp)S.q=inp.value;render();const ni=$('#v-'+current+' [data-sform] input');if(ni)ni.focus();return}
  if(d.song){selectSong(d.song,true);if(current!=='music')location.hash='music';else render();return}
  if(t.id==='pp'){togglePlay();return}
  if(d.seek!=null){S.t=+d.seek;updMusic();return}
  if(d.fav){
    if(!S.user){toast('登入後才能收藏',['前往登入','account']);return}
    S.favs.has(d.fav)?S.favs.delete(d.fav):S.favs.add(d.fav);save();
    const on=S.favs.has(d.fav);toast(on?'已加入收藏':'已取消收藏');
    $$(`[data-fav="${d.fav}"]`).forEach(b=>{b.setAttribute('aria-pressed',on);b.innerHTML=ic('heart',on)});return}
  if(d.go){goto(JSON.parse(d.go));return}
  if(d.q){S.q=d.q;S.mode='all';location.hash==='#search'?render():location.hash='search';return}
  if(d.show){S.show=d.show;S.ep=SHOWS.find(x=>x.id===d.show).eps[0].id;S.pt=0;S.findQ='';S.pplaying=false;clearInterval(pt);render();return}
  if(d.ep){S.ep=d.ep;S.pt=0;S.findQ='';S.pplaying=false;clearInterval(pt);render();return}
  if(t.id==='podplay'){togglePod();return}
  if(d.pt!=null){S.pt=+d.pt;render();return}
  if('clearfind' in d){S.findQ='';render();return}
  if('ext' in d){toast('原型不連到外部網站；正式版會在新分頁開啟原始頁面');return}
  if(d.cat){S.newsCat=d.cat;S.newsFocus=null;render();return}
  if(d.ask){runAsk(d.ask);return}
  if('report' in d){toast('已收到回報，編輯會檢查這個回答與來源');return}
  if('newask' in d){S.ask=null;render();$('#askq').focus();return}
  if(d.chart){S.chart=d.chart;render();return}
  if(d.login){S.user={ids:[d.login]};save();toast(`已用 ${d.login} 登入（模擬）`);render();return}
  if(d.link){S.user.ids.push(d.link);save();toast(`已綁定 ${d.link}`);render();return}
  if('logout' in d){S.user=null;S.confirmDel=false;save();toast('已登出');render();return}
  if('export' in d){toast('匯出申請已建立，完成後會寄到你的 Email（模擬）');return}
  if('del' in d){S.confirmDel=true;render();return}
  if('delno' in d){S.confirmDel=false;render();return}
  if('delyes' in d){S.user=null;S.favs.clear();S.history=[];S.confirmDel=false;save();toast('帳號已刪除（模擬）');render();return}
  if('clearhist' in d){S.history=[];save();toast('已清除播放紀錄');render();return}
  if('newform' in d){S.sent=null;render();return}
  if(d.cookie){store.set('cookie',d.cookie);$('#cookie').hidden=true;toast(d.cookie==='all'?'已允許分析 Cookie':'只使用必要 Cookie');return}
  if(t.id==='open-cookie'){$('#cookie').hidden=false;return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.matches('[data-sform]')||f.id==='mini-search'){
    const v=f.querySelector('input').value.trim();S.q=v;if(f.id==='mini-search')S.mode='all';
    location.hash==='#search'?render():location.hash='search';return}
  if(f.id==='askf'){const v=$('#askq').value.trim();if(!v){$('#ask-err').hidden=false;$('#askq').focus();return}runAsk(v);return}
  if(f.id==='cform'){
    const req=[['f-cat','請選擇類別'],['f-name','請填寫聯絡人'],['f-email','請填寫有效的 Email'],['f-msg','請填寫內容']];
    let first=null;
    $$('.field',f).forEach(x=>{x.classList.remove('err');const m=x.querySelector('.err-msg');if(m)m.remove()});
    req.forEach(([id,msg])=>{const el=$('#'+id);const bad=!el.value.trim()||(id==='f-email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value));
      if(bad){const fd=el.closest('.field');fd.classList.add('err');fd.insertAdjacentHTML('beforeend',`<span class="err-msg">${msg}</span>`);el.setAttribute('aria-invalid','true');first=first||el}else el.removeAttribute('aria-invalid')});
    const file=$('#f-file').files[0];
    if(file&&file.size>10*1024*1024){const fd=$('#f-file').closest('.field');fd.classList.add('err');fd.insertAdjacentHTML('beforeend','<span class="err-msg">檔案超過 10MB，請壓縮後再上傳</span>');first=first||$('#f-file')}
    if(first){first.focus();toast('還有欄位需要修正');return}
    const b=$('#f-send');b.disabled=true;b.textContent='送出中…';
    setTimeout(()=>{S.sent='CS-20261126-0042';render();toast('已送出')},900);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='findq'){S.findQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#findq');i.focus();i.setSelectionRange(pos,pos)}
  if(e.target.id==='askq')$('#ask-err').hidden=true;
});
document.addEventListener('change',e=>{
  if(e.target.id==='pref-lyrics'){S.prefs.lyrics=e.target.checked;save();toast(e.target.checked?'已開啟同步歌詞':'已關閉同步歌詞')}
  if(e.target.id==='pref-personal'){S.prefs.personal=e.target.checked;save();toast(e.target.checked?'已開啟個人化推薦':'已關閉個人化推薦')}
});
function runAsk(q){
  S.ask=q;S.asking=true;
  if(current!=='explore')location.hash='explore';else render();
  setTimeout(()=>{S.asking=false;if(current==='explore')render()},900);
}

/* ---------- Boot ---------- */
if(!store.get('cookie',null))$('#cookie').hidden=false;
route();
</script>
</body>
</html>
